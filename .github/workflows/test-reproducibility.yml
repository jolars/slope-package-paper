name: Test Reproducibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual triggering

jobs:
  devenv:
    name: Reproducible environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        run: nix profile add nixpkgs#devenv

      - name: Test reproducible environment
        run: devenv test --no-tui

      - name: Build benchmark container
        run: devenv container build shell

  benchmarks:
    name: Benchmark (${{ matrix.benchmark }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        benchmark: [benchmark_slope, benchmark_slope_path]
    env:
      PYTHONUTF8: 1
      KMP_DUPLICATE_LIB_OK: TRUE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up benchopt
        if: matrix.benchmark == 'benchmark_slope_path'
        uses: jolars/setup-benchopt@main

      - name: Install benchmark dependencies
        if: matrix.benchmark == 'benchmark_slope_path'
        run: |
          benchopt install ./${{ matrix.benchmark }} --config ${{ matrix.benchmark }}/example_config.yml -y

      - name: Run benchmark with example config
        if: matrix.benchmark == 'benchmark_slope_path'
        run: |
          benchopt run ./${{ matrix.benchmark }} --config ${{ matrix.benchmark }}/example_config.yml

      - name: Set up Python for Metewand
        if: matrix.benchmark == 'benchmark_slope'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check out pinned Metewand
        if: matrix.benchmark == 'benchmark_slope'
        uses: actions/checkout@v7
        with:
          repository: jolars/metewand
          ref: 10f6b13ef8d5607b6e26a7a1ab10ebca17d278e4
          path: .metewand-source

      - name: Set up Rust for Metewand
        if: matrix.benchmark == 'benchmark_slope'
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Build Metewand and install example dependencies
        if: matrix.benchmark == 'benchmark_slope'
        shell: bash
        run: |
          git -C .metewand-source apply ../nix/metewand.patch
          cargo build --release --locked --manifest-path .metewand-source/Cargo.toml
          python -m pip install ./.metewand-source/packages/python \
            numpy scipy scikit-learn numba sortedl1 'tick==0.8.0.2' libsvmdata pytest pyyaml

      - name: Test native scientific code
        if: matrix.benchmark == 'benchmark_slope'
        run: python -m pytest benchmark_slope/tests -q

      - name: Validate native Metewand benchmark
        if: matrix.benchmark == 'benchmark_slope'
        run: >-
          python benchmark_slope/validate.py
          --metewand .metewand-source/target/release/metewand
          --manifest benchmark_slope/example_config.yml
          --output-dir benchmark_slope/outputs/example

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.benchmark }}-${{ matrix.os }}
          path: ${{ matrix.benchmark }}/outputs/
          retention-days: 30

  examples:
    name: Paper code examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cm-super \
            dvipng \
            ghostscript \
            lmodern \
            texlive-extra-utils \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-science

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install sortedl1 matplotlib scikit-learn pandas numpy scipy pyarrow

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::SLOPE
            any::knitr
            any::tinytex
            any::here
            any::lars
            any::caret
            any::pROC
            any::glmnet
            any::MLmetrics

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run R example
        run: Rscript code/example.R

      - name: Run Python example
        run: python code/example.py

      - name: Run Julia example
        run: julia --project=. code/example.jl
        env:
          GKSwstype: "100" # Headless GR backend

      - name: Run plotting scripts
        run: |
          python code/plot_benchmark_path.py
          python code/plot_benchmark_real.py
          python code/plot_benchmark_simul.py
          python code/plot_thresholding.py

      - name: Run real data analysis
        run: Rscript code/real-data.R

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: figures
          path: images/
          retention-days: 30

  cpp-example:
    name: C++ example
    runs-on: ubuntu-latest
    env:
      LIBSLOPE_VERSION: 6.5.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev

      - name: Build and install libslope
        run: |
          git clone --depth 1 --branch "v${LIBSLOPE_VERSION}" \
            https://github.com/jolars/libslope.git
          cmake -S libslope -B libslope/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build libslope/build
          sudo cmake --install libslope/build

      - name: Build the example
        run: |
          cmake -S code -B build
          cmake --build build

      - name: Run the example
        run: ./build/slope-example

  paper:
    name: Compile paper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode

      - name: Upload paper
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: main.pdf
          retention-days: 30
