name: Test Reproducibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual triggering

jobs:
  benchmarks:
    name: Benchmark (${{ matrix.benchmark }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        benchmark: [benchmark_slope, benchmark_slope_path]
    env:
      PYTHONUTF8: 1
      KMP_DUPLICATE_LIB_OK: TRUE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up benchopt
        uses: jolars/setup-benchopt@main

      - name: Install benchmark dependencies
        run: |
          benchopt install ./${{ matrix.benchmark }} --config ${{ matrix.benchmark }}/example_config.yml -y

      - name: Run benchmark with example config
        run: |
          benchopt run ./${{ matrix.benchmark }} --config ${{ matrix.benchmark }}/example_config.yml

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.benchmark }}-${{ matrix.os }}
          path: ${{ matrix.benchmark }}/outputs/
          retention-days: 30

  examples:
    name: Paper code examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript texlive-extra-utils

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install sortedl1 matplotlib scikit-learn pandas numpy scipy pyarrow

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::SLOPE
            any::knitr
            any::tinytex
            any::here
            any::lars
            any::caret
            any::pROC
            any::glmnet
            any::MLmetrics

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run R example
        run: Rscript code/example.R

      - name: Run Python example
        run: python code/example.py

      - name: Run Julia example
        run: julia --project=. code/example.jl
        env:
          GKSwstype: "100" # Headless GR backend

      - name: Run plotting scripts
        run: |
          python code/plot_benchmark_path.py
          python code/plot_benchmark_real.py
          python code/plot_benchmark_simul.py
          python code/plot_thresholding.py

      - name: Run real data analysis
        run: Rscript code/real-data.R

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: figures
          path: images/
          retention-days: 30

  cpp-example:
    name: C++ example
    runs-on: ubuntu-latest
    env:
      LIBSLOPE_VERSION: 6.5.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev

      - name: Build and install libslope
        run: |
          git clone --depth 1 --branch v${LIBSLOPE_VERSION} \
            https://github.com/jolars/libslope.git
          cmake -S libslope -B libslope/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build libslope/build
          sudo cmake --install libslope/build

      - name: Build the example
        run: |
          cmake -S code -B build
          cmake --build build

      - name: Run the example
        run: ./build/slope-example

  paper:
    name: Compile paper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode

      - name: Upload paper
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: main.pdf
          retention-days: 30
