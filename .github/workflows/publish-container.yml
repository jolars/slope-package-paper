name: Publish Benchmark Container

on:
  release:
    types: [published]

concurrency:
  group: publish-benchmark-container-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish benchmark container
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        run: nix profile add nixpkgs#devenv

      - name: Prepare image tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          container_tag="$(printf '%s' "$RELEASE_TAG" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"

          if [[ -z "$container_tag" || ${#container_tag} -gt 128 ]]; then
            echo "The release tag cannot be converted to a valid OCI tag." >&2
            exit 1
          fi

          {
            printf 'image=ghcr.io/%s/slope-package-benchmarks\n' "$owner"
            printf 'registry=docker://ghcr.io/%s/\n' "$owner"
            printf 'release_tag=%s\n' "$container_tag"
            printf 'commit_tag=sha-%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Test reproducible environment
        run: devenv test --no-tui

      - name: Build released container
        env:
          CONTAINER_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          devenv -O containers.shell.version:string "$CONTAINER_TAG" \
            container build shell

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish release and commit tags
        id: publish
        env:
          COMMIT_TAG: ${{ steps.tags.outputs.commit_tag }}
          IMAGE: ${{ steps.tags.outputs.image }}
          REGISTRY: ${{ steps.tags.outputs.registry }}
          RELEASE_NAME: ${{ github.event.release.tag_name }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          devenv -O containers.shell.version:string "$RELEASE_TAG" \
            container copy --registry "$REGISTRY" \
            --copy-args=--digestfile=release-digest.txt shell
          devenv -O containers.shell.version:string "$COMMIT_TAG" \
            container copy --registry "$REGISTRY" \
            --copy-args=--digestfile=commit-digest.txt shell

          cmp release-digest.txt commit-digest.txt
          digest="$(<release-digest.txt)"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "The registry returned an invalid image digest: $digest" >&2
              exit 1
              ;;
          esac

          {
            printf 'GitHub release: %s\n' "$RELEASE_NAME"
            printf 'Platform: linux/amd64\n'
            printf 'Release image: %s:%s\n' "$IMAGE" "$RELEASE_TAG"
            printf 'Commit image: %s:%s\n' "$IMAGE" "$COMMIT_TAG"
            printf 'Digest: %s\n' "$digest"
            printf 'Immutable reference: %s@%s\n' "$IMAGE" "$digest"
          } > container-image.txt

          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          cat container-image.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attach image reference to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" container-image.txt --clobber
