# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/13b0f9e6ac78abbbb736c635d87845c4f4bee51b
  libslope:
    url: github:jolars/libslope/v6.5.4
    inputs:
      nixpkgs:
        follows: nixpkgs
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  metewand:
    url: github:jolars/metewand/1b29eb59648f48b462744b3d2860ecde6287e4f7
    flake: false
  rust-overlay:
    url: github:oxalica/rust-overlay/b962e5d0c8cd97196c6a882d659fe451b52ad989
    inputs:
      nixpkgs:
        follows: nixpkgs
