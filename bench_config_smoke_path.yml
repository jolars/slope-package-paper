objective:
  - SLOPE_Path[fit_intercept=False,q=0.2,path_length=5,target_rel_duality_gap=1e-7]

dataset:
  - Simulated[X_density=1.0,n_features=20,n_samples=40,rho=0.2,n_signals=5]

solver:
  - sortedl1[cd_type=permuted]
  - SolutionPath
  - ADMM[rho=100]
  - PGD[acceleration=fista]

n-repetitions: 1
