objective:
  - SLOPE[fit_intercept=False,q=0.2,reg=0.1]

dataset:
  - Simulated[X_density=1.0,n_features=20,n_samples=40,rho=0.2,n_signals=5]

solver:
  - PGD[prox=prox_fast_stack,acceleration=fista]
  - ADMM[adaptive_rho=False,rho=100]
  - sortedl1[cd_type=permuted]
  - skglm
  - SlopePath
  - Newt-ALM[inner_solver=auto]
  - PGD_safe_screening[accelerated=True]

n-repetitions: 1
