# Native Metewand convergence benchmark.
version: 1
name: slope-single
worker-timeouts: {hello: 60 s, materialize: 30 min, prepare: 10 min, execute: 60 s, reset: 30 s, evaluate: 2
    min, shutdown: 30 s}
datasets:
  simulated-dense:
    runner: python
    protocol-transport: socket
    entrypoint: dataset_worker.py
    args: [simulated]
    sources: &id002 ['*.py', solvers/*.py, datasets/*.py, ORIGINS.json]
    output-schema: &id001
      type: object
      properties:
        schema_version: {const: 1}
        complete: {const: true}
        files: {type: array, minItems: 1}
      required: [schema_version, complete, files]
    parameters:
      n_samples: {type: integer, default: 40}
      n_features: {type: integer, default: 20}
      n_signals: {type: integer, default: 5}
      X_density: {type: number, default: 1.0}
      rho: {type: number, default: 0.2}
      random_state: {type: integer, default: 27}
problems:
  slope:
    family: slope
    parameters:
      reg: {type: number, exclusiveMinimum: 0, default: 0.1}
      q: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, default: 0.2}
      fit_intercept: {type: boolean, default: false}
    dataset-schemas:
    - *id001
    result:
      coefficients:
        type: string
        enum: [beta.npy]
    metrics:
      value: {type: number, optional: true}
      duality_gap: {type: number, optional: true}
      rel_duality_gap: {type: number, optional: true}
      target_rel_duality_gap: {type: number, optional: true}
    allowed-timing-scopes: [execute_only]
    supported-budgets: [none]
    semantics:
      preprocessing:
        shared_materialization: upstream_dataset_generation_and_standardization
        implementation_conversion: preserve_values_and_order
        allowed_outside_timed_scope: [dataset_loading, penalty_weights, solver_construction, jit_warmup]
      validity: {relative_gap_floor: -1.0e-10, coefficients: finite_intercept_first_vector_matching_design,
        absent_intercept: zero}
      one_shot_completion: {rel_duality_gap: 1.0e-07}
    reference-cases: [{dataset: reference/dataset, result: reference/result, expected-metrics: reference/metrics.json}]
    evaluator:
      runner: python
      protocol-transport: socket
      entrypoint: evaluator.py
      args: []
      sources: *id002
implementations:
  pgd-fista:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [python_pgd]
    sources: *id002
    problem-contracts: [slope]
    capabilities: [streaming_profile, applicability]
    parameters:
      prox: {type: string, default: prox_fast_stack}
      acceleration: {type: string, default: fista}
  sortedl1:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [sortedl1]
    sources: *id002
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
    parameters:
      cd_type: {type: string, default: permuted}
  tick:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [tick]
    sources: *id002
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
    parameters: {}
experiments:
- name: single
  problem: slope
  datasets: [simulated-dense]
  implementations: [pgd-fista, sortedl1, tick]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
execution-policies:
  local: {timing-scope: execute_only, primary-time: timed_wall_time, worker-reuse: true, warmup-runs: 1,
    max-concurrency: 1, timeout: 30 s}
observation-policies:
  convergence:
    kind: profile
    metric: rel_duality_gap
    direction: at_most
    threshold: 1.0e-07
    max-observations: 32
    max-checkpoint-bytes: 67108864
    max-active-time: 30 s
    implementations:
      pgd-fista:
        delivery: streaming_profile
        measurement-basis: executor_observed
        check-schedule:
          indices: [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536,
            131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864,
            134217728, 268435456, 536870912, 1073741824]
      sortedl1:
        delivery: fresh_sequence
        control-schema:
          type: object
          oneOf:
          - properties:
              initial: {const: true}
            required: [initial]
            additionalProperties: false
          - properties:
              tolerance: {type: number, exclusiveMinimum: 0}
            required: [tolerance]
            additionalProperties: false
        schedule:
          kind: explicit
          controls: [{initial: true}, {tolerance: 0.1}, {tolerance: 0.01}, {tolerance: 0.001}, {tolerance: 0.0001},
            {tolerance: 1.0e-05}, {tolerance: 1.0e-06}, {tolerance: 1.0e-07}, {tolerance: 1.0e-08}, {
              tolerance: 1.0e-09}, {tolerance: 1.0e-10}, {tolerance: 1.0e-11}, {tolerance: 1.0e-12}]
      tick:
        delivery: fresh_sequence
        control-schema:
          type: object
          oneOf:
          - properties:
              initial: {const: true}
            required: [initial]
            additionalProperties: false
          - properties:
              iterations: {type: integer, minimum: 1}
            required: [iterations]
            additionalProperties: false
        schedule:
          kind: explicit
          controls: [{initial: true}, {iterations: 1}, {iterations: 2}, {iterations: 4}, {iterations: 8},
            {iterations: 16}, {iterations: 32}, {iterations: 64}, {iterations: 128}, {iterations: 256},
            {iterations: 512}, {iterations: 1024}, {iterations: 2048}, {iterations: 4096}, {iterations: 8192},
            {iterations: 16384}, {iterations: 32768}, {iterations: 65536}, {iterations: 131072}, {iterations: 262144},
            {iterations: 524288}, {iterations: 1048576}, {iterations: 2097152}, {iterations: 4194304},
            {iterations: 8388608}, {iterations: 16777216}, {iterations: 33554432}, {iterations: 67108864},
            {iterations: 134217728}, {iterations: 268435456}, {iterations: 536870912}, {iterations: 1073741824}]
