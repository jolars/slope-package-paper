version: "3"

tasks:
  plots:
    desc: "Regenerate all paper figures from examples and saved benchmark results"
    dir: "{{.TASKFILE_DIR}}"
    env:
      MPLBACKEND: Agg
      GKSwstype: "100"
    cmds:
      - Rscript code/example.R
      - Rscript code/real-data.R
      - python code/example.py
      - julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - julia --project=. code/example.jl
      - python code/plot_thresholding.py
      - python code/plot_benchmark_real.py
      - python code/plot_benchmark_simul.py
      - python code/plot_benchmark_path.py

  arxiv:
    cmds:
      - rm -rf _build/arxiv
      - mkdir -p _build/arxiv
      - mkdir -p _build/arxiv/tex _build/arxiv/code
      - latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - |
        cp -r \
          main.bbl \
          main.bib \
          main.tex \
          images/ \
          _build/arxiv/
        cp -r tex/macros.tex _build/arxiv/tex/
        cp code/example.cpp _build/arxiv/code/
      - >-
        cp els-cas-templates/cas-sc.cls els-cas-templates/cas-common.sty
        els-cas-templates/cas-model2-names.bst _build/arxiv/
      - rm -f _build/arxiv-{{.DATE}}.tar.gz
      - cd _build/arxiv && tar -czf ../arxiv-{{.DATE}}.tar.gz .
      - rm -rf _build/arxiv-temp
    vars:
      DATE:
        sh: date +%Y%m%d

  get-packages:
    desc: "Download required external packages"
    vars:
      CPP_VER: 6.5.4
      PYTHON_VER: 1.11.3
      R_VER: 2.1.1
      JULIA_VER: 1.3.1
    cmds:
      - rm -rf _build/packages
      - mkdir -p _build/packages/
      - curl -L -o _build/packages/libslope-{{.CPP_VER}}.tar.gz
        "https://github.com/jolars/libslope/archive/refs/tags/v{{.CPP_VER}}.tar.gz"
      - curl -L -o _build/packages/sortedl1-{{.PYTHON_VER}}.tar.gz
        "https://github.com/jolars/sortedl1/archive/refs/tags/v{{.PYTHON_VER}}.tar.gz"
      - curl -L -o _build/packages/SLOPE-{{.R_VER}}.tar.gz
        "https://github.com/jolars/SLOPE/archive/refs/tags/v{{.R_VER}}.tar.gz"
      - curl -L -o _build/packages/SLOPE-jl-{{.JULIA_VER}}.tar.gz
        "https://github.com/jolars/SLOPE.jl/archive/refs/tags/v{{.JULIA_VER}}.tar.gz"

  csda:
    desc: "Prepare the cover letter, manuscript, code, and LaTeX source for CSDA"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - git submodule update --init --recursive
      - rm -rf _build/csda
      - mkdir -p _build/csda/.staging/source/code _build/csda/.staging/supplementary
      - latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - latexmk -pdf -interaction=nonstopmode -halt-on-error cover-letter.tex
      - cp main.pdf cover-letter.pdf _build/csda/
      - cp main.tex main.bib main.bbl tex/macros.tex images/*.pdf _build/csda/.staging/source/
      - cp code/example.cpp _build/csda/.staging/source/code/
      - >-
        cp els-cas-templates/cas-sc.cls els-cas-templates/cas-common.sty
        els-cas-templates/cas-model2-names.bst _build/csda/.staging/source/
      - sed -i -e 's@tex/macros@macros@' -e 's@images/@@g' _build/csda/.staging/source/main.tex
      - latexmk -cd -pdf -interaction=nonstopmode -halt-on-error _build/csda/.staging/source/main.tex
      - >-
        tar -czf _build/csda/latex-source-{{.DATE}}.tar.gz
        --exclude=main.pdf --exclude='*.aux' --exclude='*.fdb_latexmk'
        --exclude='*.fls' --exclude='*.log' --exclude='*.out'
        --exclude='*.spl' --exclude='*.abs' --exclude='*.blg'
        --exclude='*.synctex.gz'
        -C _build/csda/.staging/source .
      - |
        set -eu
        set -o pipefail
        git ls-files --recurse-submodules -z -- \
          README.md LICENSE LICENSE-CODE LICENSE-PAPER Taskfile.yml \
          devenv.nix devenv.yaml devenv.lock Project.toml Manifest.toml \
          bench_config_*.yml code slopeutils data nix \
          results/single_1007 results/path_1007 \
          benchmark_slope benchmark_slope_path \
          | tar --null -T - -cf - \
          | tar -xf - -C _build/csda/.staging/supplementary
        {
          printf 'Paper commit: %s\n' "$(git rev-parse HEAD)"
          git submodule status --recursive
          printf '\nWorking tree changes included in this archive:\n'
          git status --short
        } > _build/csda/.staging/supplementary/source-versions.txt
      - >-
        tar -czf _build/csda/supplementary-code-{{.DATE}}.tar.gz
        -C _build/csda/.staging/supplementary .
      - rm -rf _build/csda/.staging
    vars:
      DATE:
        sh: date +%Y%m%d
