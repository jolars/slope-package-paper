version: "3"

tasks:
  paper-render:
    desc: "Render the Computo manuscript as HTML and PDF"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - quarto render

  paper-preview:
    desc: "Preview the Computo HTML manuscript"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - quarto preview main.qmd --to computo-html

  paper-preview-pdf:
    desc: "Preview the Computo PDF manuscript"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - quarto preview main.qmd --to computo-pdf

  computo:
    desc: "Prepare Computo HTML, PDF, and a plain-text abstract"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - mkdir -p _build/computo
      - quarto render --output-dir=_build/computo
      - cp _build/computo/README.md README.md
      - quarto pandoc /dev/null --metadata-file=_quarto.yml
        --lua-filter=code/abstract.lua --from=markdown --to=plain --wrap=none
        --output=_build/computo/abstract.txt

  arxiv:
    desc: "Build and verify an arXiv source archive from Quarto"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - bash code/make-arxiv.sh

  plots:
    desc: "Regenerate all paper figures from examples and saved benchmark results"
    dir: "{{.TASKFILE_DIR}}"
    env:
      MPLBACKEND: Agg
      GKSwstype: "100"
    cmds:
      - Rscript code/example.R
      - Rscript code/real-data.R
      - python code/example.py
      - julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - julia --project=. code/example.jl
      - python code/plot_thresholding.py
      - python code/plot_benchmark_real.py
      - python code/plot_benchmark_simul.py
      - python code/plot_benchmark_path.py

  get-packages:
    desc: "Download required external packages"
    vars:
      CPP_VER: 6.5.4
      PYTHON_VER: 1.11.3
      R_VER: 2.1.1
      JULIA_VER: 1.3.1
    cmds:
      - rm -rf _build/packages
      - mkdir -p _build/packages/
      - curl -L -o _build/packages/libslope-{{.CPP_VER}}.tar.gz
        "https://github.com/jolars/libslope/archive/refs/tags/v{{.CPP_VER}}.tar.gz"
      - curl -L -o _build/packages/sortedl1-{{.PYTHON_VER}}.tar.gz
        "https://github.com/jolars/sortedl1/archive/refs/tags/v{{.PYTHON_VER}}.tar.gz"
      - curl -L -o _build/packages/SLOPE-{{.R_VER}}.tar.gz
        "https://github.com/jolars/SLOPE/archive/refs/tags/v{{.R_VER}}.tar.gz"
      - curl -L -o _build/packages/SLOPE-jl-{{.JULIA_VER}}.tar.gz
        "https://github.com/jolars/SLOPE.jl/archive/refs/tags/v{{.JULIA_VER}}.tar.gz"
