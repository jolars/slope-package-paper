objective:
  - SLOPE_Path[fit_intercept=False,q=0.2,path_length=50]
  - SLOPE_Path[fit_intercept=False,q=0.2,path_length=100]
  - SLOPE_Path[fit_intercept=False,q=0.2,path_length=200]

dataset:
  - breheny[dataset=brca1,standardize=True]
  - breheny[dataset=Koussounadis2014,standardize=True]
  - breheny[dataset=Rhee2006,standardize=True]

solver:
  - sortedl1[cd_type=permuted]
  - SolutionPath
  - ADMM[rho=100]
  - PGD[acceleration=fista]

n-repetitions: 1
