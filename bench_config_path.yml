# Shared definitions for full, smoke, and example runs.
version: 1
name: slope-path
default-experiment: full
worker-timeouts: {hello: 60 s, materialize: 30 min, prepare: 10 min, execute: 60 s, reset: 30 s, evaluate: 2
    min, shutdown: 30 s}
environments:
  local:
    kind: local
    environment-variables: {BLIS_NUM_THREADS: '1', MKL_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1', OMP_NUM_THREADS: '1',
      OPENBLAS_NUM_THREADS: '1', VECLIB_MAXIMUM_THREADS: '1', OMP_DYNAMIC: 'FALSE', PYTHONHASHSEED: '0'}
datasets:
  brca1:
    sources: &sources [benchmark_slope_path/*.py, benchmark_slope_path/solvers/*.py, benchmark_slope_path/datasets/*.py,
      benchmark_slope_path/ORIGINS.json]
    output-schema: &id001 {type: object, properties: {schema_version: {const: 1}, complete: {const: true},
        files: {type: array, minItems: 1}}, required: [schema_version, complete, files]}
    parameters:
      dataset: {type: string, default: brca1}
      standardize: {type: boolean, default: true}
    function: benchmark_slope_path/dataset_worker.py:breheny
  Koussounadis2014:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: Koussounadis2014}
      standardize: {type: boolean, default: true}
    function: benchmark_slope_path/dataset_worker.py:breheny
  Rhee2006:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: Rhee2006}
      standardize: {type: boolean, default: true}
    function: benchmark_slope_path/dataset_worker.py:breheny
  smoke-dense:
    sources: *sources
    output-schema: {type: object, properties: {schema_version: {const: 1}, complete: {const: true}, files: {
          type: array, minItems: 1}}, required: [schema_version, complete, files]}
    parameters:
      n_samples: {type: integer, default: 40}
      n_features: {type: integer, default: 20}
      n_signals: {type: integer, default: 5}
      X_density: {type: number, default: 1.0}
      rho: {type: number, default: 0.2}
      random_state: {type: integer, default: 27}
    function: benchmark_slope_path/dataset_worker.py:simulated
  smoke-sparse:
    sources: *sources
    output-schema: {type: object, properties: {schema_version: {const: 1}, complete: {const: true}, files: {
          type: array, minItems: 1}}, required: [schema_version, complete, files]}
    parameters:
      n_samples: {type: integer, default: 40}
      n_features: {type: integer, default: 20}
      n_signals: {type: integer, default: 5}
      X_density: {type: number, default: 0.2}
      rho: {type: number, default: 0.2}
      random_state: {type: integer, default: 27}
    function: benchmark_slope_path/dataset_worker.py:simulated
problems:
  slope-path:
    family: slope-path
    parameters:
      path_length: {type: integer, minimum: 1, default: 5}
      q: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, default: 0.2}
      fit_intercept: {type: boolean, default: false}
    dataset-schemas:
    - *id001
    result:
      coefficients: {type: string, enum: [coefs.npy]}
      intercepts: {type: string, enum: [intercepts.npy]}
    metrics:
      value: {type: number, optional: true}
      max_rel_duality_gap: {type: number, optional: true}
      min_rel_duality_gap: {type: number, optional: true}
      max_abs_duality_gap: {type: number, optional: true}
      mean_rel_duality_gaps: {type: number, optional: true}
      mean_abs_duality_gaps: {type: number, optional: true}
      target_rel_duality_gap: {type: number, optional: true}
    allowed-timing-scopes: [execute_only]
    supported-budgets: [none]
    semantics:
      preprocessing:
        shared_materialization: upstream_data_standardization
        implementation_conversion: preserve_values_and_order
        allowed_outside_timed_scope: [dataset_loading, shared_path_grid_loading, solver_construction,
          jit_warmup]
        shared_preparation: sortedl1_path_grid
      validity: {relative_gap_floor: -1.0e-10, coefficients: finite_features_by_actual_path_length_matrix,
        intercepts: finite_actual_path_length_vector, absent_intercept: zero}
      one_shot_completion: {max_rel_duality_gap: 1.0e-07}
    reference-cases:
    - dataset: benchmark_slope_path/reference/dataset
      result: benchmark_slope_path/reference/result
      expected-metrics: benchmark_slope_path/reference/metrics.json
      metric-tolerance: {absolute: 1.0e-12, relative: 1.0e-12}
    evaluator:
      runner: python
      entrypoint: benchmark_slope_path/evaluator.py
      sources: *sources
      protocol-transport: socket
    preparation:
      function: benchmark_slope_path/preparation.py:prepare_grid
      sources: *sources
      output-schema: *id001
implementations:
  sortedl1:
    runner: python
    entrypoint: benchmark_slope_path/solver_worker.py
    args: [sortedl1_solver]
    sources: *sources
    protocol-transport: socket
    problem-contracts: [slope-path]
    capabilities: [fresh_sequence, applicability]
    parameters:
      cd_type: {type: string, enum: [permuted, cyclical], default: permuted}
  solution-path:
    runner: python
    entrypoint: benchmark_slope_path/solver_worker.py
    args: [solution_path]
    sources: *sources
    protocol-transport: socket
    problem-contracts: [slope-path]
    capabilities: [fresh_sequence, applicability]
  admm:
    runner: python
    entrypoint: benchmark_slope_path/solver_worker.py
    args: [admm]
    sources: *sources
    protocol-transport: socket
    problem-contracts: [slope-path]
    capabilities: [fresh_sequence, applicability]
    parameters:
      rho: {type: number, exclusiveMinimum: 0, default: 100}
  pgd-fista:
    runner: python
    entrypoint: benchmark_slope_path/solver_worker.py
    args: [pgd]
    sources: *sources
    protocol-transport: socket
    problem-contracts: [slope-path]
    capabilities: [fresh_sequence, applicability]
    parameters:
      acceleration: {type: string, enum: [none, fista], default: fista}
  rslope:
    runner: python
    entrypoint: benchmark_slope_path/solver_worker.py
    args: [rslope]
    sources: *sources
    protocol-transport: socket
    problem-contracts: [slope-path]
    capabilities: [fresh_sequence, applicability]
experiments:
- name: full
  problem: slope-path
  datasets: [brca1, Koussounadis2014, Rhee2006]
  implementations: [sortedl1, solution-path, admm, pgd-fista]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
  problem-parameters:
    path_length:
      grid: [50, 100, 200]
- name: smoke
  problem: slope-path
  datasets: [smoke-dense, smoke-sparse]
  implementations: [sortedl1, solution-path, admm, pgd-fista, rslope]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
  cases:
  - {name: no-intercept}
  - name: intercept
    problem-parameters: {fit_intercept: true}
- name: example
  problem: slope-path
  datasets: [smoke-dense]
  implementations: [sortedl1, solution-path, admm, pgd-fista]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
execution-policies:
  local: {timing-scope: execute_only, primary-time: timed_wall_time, worker-reuse: true, warmup-runs: 1,
    max-concurrency: 1, timeout: 30 s}
observation-policies:
  convergence:
    kind: profile
    metric: max_rel_duality_gap
    direction: at_most
    threshold: 1.0e-07
    max-observations: 32
    max-checkpoint-bytes: 67108864
    max-active-time: 30 s
    implementations:
      sortedl1: &id002
        delivery: fresh_sequence
        schedule: {kind: geometric, field: tolerance, start: 0.1, ratio: 0.1, count: 12, prefix: [{initial: true}]}
        controls:
          tolerance: {type: number, exclusiveMinimum: 0}
      solution-path:
        delivery: fresh_sequence
        schedule: {kind: geometric, field: iterations, start: 1, ratio: 2, count: 31, prefix: [{initial: true}]}
        controls:
          iterations: {type: integer, minimum: 1}
      admm: *id002
      pgd-fista: *id002
      rslope: *id002
