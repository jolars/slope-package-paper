# Shared definitions for full, smoke, and example runs.
version: 1
name: slope-single
default-experiment: full
worker-timeouts: {hello: 60 s, materialize: 30 min, prepare: 10 min, execute: 60 s, reset: 30 s, evaluate: 2
    min, shutdown: 30 s}
environments:
  local:
    kind: local
    environment-variables: {BLIS_NUM_THREADS: '1', MKL_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1', OMP_NUM_THREADS: '1',
      OPENBLAS_NUM_THREADS: '1', VECLIB_MAXIMUM_THREADS: '1', OMP_DYNAMIC: 'FALSE', PYTHONHASHSEED: '0'}
datasets:
  simulated-high:
    sources: &sources ["*.py", solvers/*.py, datasets/*.py,
      ORIGINS.json]
    output-schema: &id001 {type: object, properties: {schema_version: {const: 1}, complete: {const: true},
        files: {type: array, minItems: 1}}, required: [schema_version, complete, files]}
    parameters:
      n_samples: {type: integer, default: 100}
      n_features: {type: integer, default: 20000}
      n_signals: {type: integer, default: 20}
      X_density: {type: number, default: 1.0}
      rho: {type: number, default: 0.6}
      random_state: {type: integer, default: 27}
    function: dataset_worker.py:simulated
  simulated-low:
    sources: *sources
    output-schema: *id001
    parameters:
      n_samples: {type: integer, default: 20000}
      n_features: {type: integer, default: 100}
      n_signals: {type: integer, default: 40}
      X_density: {type: number, default: 1.0}
      rho: {type: number, default: 0.6}
      random_state: {type: integer, default: 27}
    function: dataset_worker.py:simulated
  simulated-sparse:
    sources: *sources
    output-schema: *id001
    parameters:
      n_samples: {type: integer, default: 2000}
      n_features: {type: integer, default: 200000}
      n_signals: {type: integer, default: 20}
      X_density: {type: number, default: 0.001}
      rho: {type: number, default: 0.6}
      random_state: {type: integer, default: 27}
    function: dataset_worker.py:simulated
  brca1:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: brca1}
      standardize: {type: boolean, default: true}
    function: dataset_worker.py:breheny
  Rhee2006:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: Rhee2006}
      standardize: {type: boolean, default: true}
    function: dataset_worker.py:breheny
  Koussounadis2014:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: Koussounadis2014}
      standardize: {type: boolean, default: true}
    function: dataset_worker.py:breheny
  rcv1-binary:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: rcv1.binary}
      standardize: {type: boolean, default: true}
    function: dataset_worker.py:libsvm
  real-sim:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: real-sim}
      standardize: {type: boolean, default: true}
    function: dataset_worker.py:libsvm
  YearPredictionMSD:
    sources: *sources
    output-schema: *id001
    parameters:
      dataset: {type: string, default: YearPredictionMSD}
      standardize: {type: boolean, default: true}
    function: dataset_worker.py:libsvm
  smoke-dense:
    sources: *sources
    output-schema: {type: object, properties: {schema_version: {const: 1}, complete: {const: true}, files: {
          type: array, minItems: 1}}, required: [schema_version, complete, files]}
    parameters:
      n_samples: {type: integer, default: 40}
      n_features: {type: integer, default: 20}
      n_signals: {type: integer, default: 5}
      X_density: {type: number, default: 1.0}
      rho: {type: number, default: 0.2}
      random_state: {type: integer, default: 27}
    function: dataset_worker.py:simulated
  smoke-sparse:
    sources: *sources
    output-schema: {type: object, properties: {schema_version: {const: 1}, complete: {const: true}, files: {
          type: array, minItems: 1}}, required: [schema_version, complete, files]}
    parameters:
      n_samples: {type: integer, default: 40}
      n_features: {type: integer, default: 30}
      n_signals: {type: integer, default: 5}
      X_density: {type: number, default: 0.2}
      rho: {type: number, default: 0.2}
      random_state: {type: integer, default: 27}
    function: dataset_worker.py:simulated
problems:
  slope:
    family: slope
    parameters:
      reg: {type: number, exclusiveMinimum: 0, default: 0.1}
      q: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, default: 0.2}
      fit_intercept: {type: boolean, default: false}
    dataset-schemas:
    - *id001
    result:
      coefficients: {type: string, enum: [beta.npy]}
    metrics:
      value: {type: number, optional: true}
      duality_gap: {type: number, optional: true}
      rel_duality_gap: {type: number, optional: true}
      target_rel_duality_gap: {type: number, optional: true}
    allowed-timing-scopes: [execute_only]
    supported-budgets: [none]
    semantics:
      preprocessing:
        shared_materialization: upstream_dataset_generation_and_standardization
        implementation_conversion: preserve_values_and_order
        allowed_outside_timed_scope: [dataset_loading, penalty_weights, solver_construction, jit_warmup]
      validity: {relative_gap_floor: -1.0e-10, coefficients: finite_intercept_first_vector_matching_design,
        absent_intercept: zero}
      one_shot_completion: {rel_duality_gap: 1.0e-07}
    reference-cases:
    - dataset: reference/dataset
      result: reference/result
      expected-metrics: reference/metrics.json
      metric-tolerance: {absolute: 1.0e-12, relative: 1.0e-12}
    evaluator:
      runner: python
      protocol-transport: socket
      entrypoint: evaluator.py
      sources: *sources
implementations:
  pgd:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [python_pgd]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [streaming_profile, applicability]
    parameters:
      prox: {type: string, default: prox_fast_stack}
      acceleration: {type: string, enum: [none, fista, bb, anderson], default: fista}
  admm:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [admm]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [streaming_profile, applicability]
    parameters:
      adaptive_rho: {type: boolean, default: false}
      rho: {type: number, default: 100}
  sortedl1:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [sortedl1]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
    parameters:
      cd_type: {type: string, default: permuted}
  tick:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [tick]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
  skglm:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [skglm]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
  slope-path:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [slope_path]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
  newt-alm:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [newt_alm]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [streaming_profile, applicability]
    parameters:
      inner_solver: {type: string, default: auto}
  safe-pgd:
    runner: python
    protocol-transport: socket
    entrypoint: solver_worker.py
    args: [pgd_safe_screening]
    sources: *sources
    problem-contracts: [slope]
    capabilities: [fresh_sequence, applicability]
    parameters:
      accelerated: {type: boolean, default: true}
experiments:
- name: full
  problem: slope
  datasets: [simulated-high, simulated-low, simulated-sparse, brca1, Rhee2006, Koussounadis2014, rcv1-binary,
    real-sim, YearPredictionMSD]
  implementations: [pgd, admm, sortedl1, tick, skglm, slope-path, newt-alm, safe-pgd]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
  problem-parameters:
    reg:
      grid: [0.5, 0.1, 0.02]
  implementation-parameters:
    pgd:
      acceleration:
        grid: [fista, bb, anderson]
- name: smoke
  problem: slope
  datasets: [smoke-dense, smoke-sparse]
  implementations: [pgd, admm, sortedl1, tick, skglm, slope-path, newt-alm, safe-pgd]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
  implementation-parameters:
    pgd:
      acceleration:
        grid: [fista, bb, anderson]
- name: example
  problem: slope
  datasets: [smoke-dense]
  implementations: [pgd, sortedl1, tick]
  execution-policy: local
  observation-policy: convergence
  measurement-repetitions: 1
  seed: 27
execution-policies:
  local: {timing-scope: execute_only, primary-time: timed_wall_time, worker-reuse: true, warmup-runs: 1,
    max-concurrency: 1, timeout: 30 s}
observation-policies:
  convergence:
    kind: profile
    metric: rel_duality_gap
    direction: at_most
    threshold: 1.0e-07
    max-observations: 32
    max-checkpoint-bytes: 67108864
    max-active-time: 30 s
    implementations:
      admm:
        delivery: streaming_profile
        measurement-basis: executor_observed
        check-schedule: {kind: geometric, start: 1, ratio: 2, count: 31, prefix: [0]}
      sortedl1:
        delivery: fresh_sequence
        schedule: {kind: geometric, field: tolerance, start: 0.1, ratio: 0.1, count: 12, prefix: [{initial: true}]}
        controls:
          tolerance: {type: number, exclusiveMinimum: 0}
      tick:
        delivery: fresh_sequence
        schedule: {kind: geometric, field: iterations, start: 1, ratio: 2, count: 31, prefix: [{initial: true}]}
        controls:
          iterations: {type: integer, minimum: 1}
      skglm:
        delivery: fresh_sequence
        schedule: {kind: geometric, field: iterations, start: 1, ratio: 2, count: 31, prefix: [{initial: true}]}
        controls:
          iterations: {type: integer, minimum: 1}
      slope-path:
        delivery: fresh_sequence
        schedule: {kind: geometric, field: iterations, start: 1, ratio: 2, count: 31, prefix: [{initial: true}]}
        controls:
          iterations: {type: integer, minimum: 1}
      newt-alm:
        delivery: streaming_profile
        measurement-basis: executor_observed
        check-schedule: {kind: geometric, start: 1, ratio: 2, count: 31, prefix: [0]}
      safe-pgd:
        delivery: fresh_sequence
        schedule: {kind: geometric, field: iterations, start: 1, ratio: 2, count: 31, prefix: [{initial: true}]}
        controls:
          iterations: {type: integer, minimum: 1}
      pgd:
        delivery: streaming_profile
        measurement-basis: executor_observed
        check-schedule: {kind: geometric, start: 1, ratio: 2, count: 31, prefix: [0]}
